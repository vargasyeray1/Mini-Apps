<!doctype html>
<html lang="ca"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generador de circuits</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172033;background:#f3f6fb}body{margin:0;padding:24px}.wrap{max-width:760px;margin:auto;background:white;padding:24px;border-radius:18px;box-shadow:0 8px 28px #10204012}h1{margin-top:0}label{display:block;font-weight:600;margin:12px 0 5px}input,select,button{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:9px;width:100%;box-sizing:border-box}button{background:#165dba;color:white;border:0;font-weight:700;margin-top:14px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.out{background:#f0f6ff;border-radius:12px;padding:16px;margin-top:18px}.station{padding:10px;border-bottom:1px solid #dbe4f0}.muted{color:#596579;font-size:.92rem}
</style>
<div class="wrap"><h1>Generador de circuits</h1><p class="muted">Crea un circuit de classe a partir del grup, el material i el temps disponible.</p>
<div class="grid"><div><label for="n">Nombre d'alumnes</label><input id="n" type="number" min="1" value="24"></div><div><label for="mat">Material disponible</label><select id="mat"><option value="cons">Cons i cercles</option><option value="pil">Pilotes</option><option value="cord">Cordes</option><option value="mix">Material variat</option><option value="cap">Sense material</option></select></div><div><label for="min">Minuts totals</label><input id="min" type="number" min="5" value="20"></div></div>
<button id="generate" type="button">Genera el circuit</button><section id="out" class="out" aria-live="polite">Introdueix les dades i genera el circuit.</section></div>
<script>
const sets={cons:["Zig-zag entre cons","Saltets dins cercles","Cursa curta de velocitat","Equilibri sobre una línia"],pil:["Passades en parelles","Botar i canviar de mà","Llançaments a una diana","Conducció de pilota"],cord:["Salts de corda","Desplaçament lateral sobre la corda","Salt i gir","Cursa amb corda a terra"],mix:["Zig-zag entre cons","Passades en parelles","Saltets dins cercles","Llançaments a una diana"],cap:["Esquats amb pes corporal","Planxa adaptada","Desplaçaments laterals","Saltets suaus"]};
function make(){
  const n = Number(document.querySelector('#n').value);
  const m = Number(document.querySelector('#min').value);
  const mat = document.querySelector('#mat').value;
  const o = document.querySelector('#out');
  if (!Number.isInteger(n) || n < 1 || !Number.isFinite(m) || m < 5) {
    o.textContent = 'Introdueix almenys 1 alumne i 5 minuts.';
    return;
  }
  const stations = Math.min(6, Math.max(3, Math.ceil(n / 4)));
  const work = Math.max(20, Math.floor((m * 60) / (stations + Math.ceil(stations / 2))));
  const names = sets[mat] || sets.cons;
  const rows = Array.from({length: stations}, (_, i) =>
    `<div class="station"><b>Estació ${i + 1}:</b> ${names[i % names.length]}<br><span class="muted">Grup ${i + 1} · treball ${Math.floor(work / 60)}:${String(work % 60).padStart(2, '0')} · rotació en sentit horari</span></div>`
  ).join('');
  o.innerHTML = `<h2>Proposta</h2><p>${n} alumnes · ${stations} estacions · ${Math.floor(work / 60)} min ${work % 60} s de treball aproximat per estació.</p>${rows}<p class="muted">Organització orientativa: adapta les tasques a l'espai, l'edat i les necessitats del grup.</p>`;
}

document.addEventListener('DOMContentLoaded', () => {
  const button = document.querySelector('#generate');
  button.addEventListener('click', make);
});
</script></html>
