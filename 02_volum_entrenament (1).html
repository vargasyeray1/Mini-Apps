<!doctype html>
<html lang="ca"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculadora de volum</title><style>
body{font-family:system-ui,sans-serif;background:#f3f6fb;color:#172033;padding:24px;margin:0}.wrap{max-width:760px;margin:auto;background:white;padding:24px;border-radius:18px}h1{margin-top:0}.row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:10px 0}label{font-weight:600;font-size:.9rem}input,button{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}button{background:#165dba;color:white;border:0;font-weight:700;cursor:pointer;margin-top:12px}.remove{background:#64748b;margin:0}.result{background:#f0f6ff;padding:16px;border-radius:12px;margin-top:18px}.muted{color:#596579}
</style><div class="wrap"><h1>Calculadora de volum d'entrenament</h1><p class="muted">Calcula el volum de càrrega extern: sèries × repeticions × pes.</p><div id="rows"></div><button onclick="add()">+ Afegeix exercici</button><button onclick="calc()">Calcula el volum total</button><div id="result" class="result" aria-live="polite">Afegeix exercicis i calcula.</div></div>
<script>
let count=0;function add(){count++;let d=document.createElement('div');d.className='row';d.innerHTML='<div><label>Exercici</label><input class="name" value="Exercici '+count+'"></div><div><label>Sèries</label><input class="sets" type="number" min="0" value="3"></div><div><label>Repeticions</label><input class="reps" type="number" min="0" value="10"></div><div><label>Pes (kg)</label><input class="weight" type="number" min="0" step="0.5" value="20"></div><div style="grid-column:span 2"><button class="remove" onclick="this.closest(\'.row\').remove()">Elimina</button></div>';document.querySelector('#rows').appendChild(d)}function calc(){let rows=[...document.querySelectorAll('.row')],sum=0;for(let r of rows){let vals=['sets','reps','weight'].map(c=>Number(r.querySelector('.'+c).value));if(vals.some(v=>!Number.isFinite(v)||v<0)){document.querySelector('#result').textContent='Revisa les dades: no s’admeten valors negatius.';return}sum+=vals.reduce((a,b)=>a*b,1)}document.querySelector('#result').innerHTML='<h2>Volum total: '+sum.toLocaleString('ca-ES',{maximumFractionDigits:2})+' kg·repetició</h2><p>'+rows.length+' exercici(s) inclosos. El resultat és la suma de sèries × repeticions × pes de cada exercici.</p>'}add();
</script></html>
