<!doctype html>
<html lang="ca"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planificador d'activitat</title><style>
body{font-family:system-ui,sans-serif;background:#f3f6fb;color:#172033;padding:24px;margin:0}.wrap{max-width:680px;margin:auto;background:white;padding:24px;border-radius:18px}h1{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:600;margin:12px 0 5px}input,button{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}button{background:#165dba;color:white;border:0;font-weight:700;margin-top:16px;cursor:pointer}.result{background:#f0f6ff;border-radius:12px;padding:16px;margin-top:18px}.muted{color:#596579}
</style><div class="wrap"><h1>Planificador d'objectius d'activitat física</h1><p class="muted">Registra els minuts d'activitat que ja has fet i calcula què falta per arribar al teu objectiu setmanal.</p><div class="grid"><div><label for="goal">Objectiu setmanal (min)</label><input id="goal" type="number" min="0" value="150"></div><div><label for="done">Minuts fets aquesta setmana</label><input id="done" type="number" min="0" value="60"></div></div><button onclick="calc()">Calcula el progrés</button><div id="result" class="result" aria-live="polite">Introdueix els minuts i calcula.</div></div>
<script>function calc(){let g=Number(document.querySelector('#goal').value),d=Number(document.querySelector('#done').value),o=document.querySelector('#result');if(!Number.isFinite(g)||!Number.isFinite(d)||g<0||d<0){o.textContent='Introdueix valors iguals o superiors a zero.';return}let p=g===0?100:Math.min(100,Math.round(d/g*100)),left=Math.max(0,g-d);o.innerHTML='<h2>'+p+'% de l’objectiu</h2><p>'+ (left?('Et falten <b>'+left+' minuts</b> per arribar a l’objectiu.'): 'Objectiu assolit!')+'</p><div style="height:14px;background:#dbe4f0;border-radius:20px;overflow:hidden"><div style="height:100%;width:'+p+'%;background:#21865b"></div></div><p class="muted">'+d+' de '+g+' minuts registrats.</p>'}</script></html>
