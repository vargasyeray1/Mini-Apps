<!doctype html>
<html lang="ca"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestor d'inscripcions</title><style>
body{font-family:system-ui,sans-serif;background:#f3f6fb;color:#172033;padding:24px;margin:0}.wrap{max-width:720px;margin:auto;background:white;padding:24px;border-radius:18px}h1{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:600;margin:12px 0 5px}input,button{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}button{background:#165dba;color:white;border:0;font-weight:700;margin-top:12px;cursor:pointer}.secondary{background:#64748b}.result{background:#f0f6ff;border-radius:12px;padding:16px;margin-top:18px}.muted{color:#596579}
</style><div class="wrap"><h1>Gestor d'inscripcions d'un torneig</h1><p class="muted">Afegeix equips i consulta participants, places disponibles i aforament.</p><div class="grid"><div><label for="capacity">Aforament màxim (persones)</label><input id="capacity" type="number" min="1" value="80"></div><div><label for="team">Nom de l'equip</label><input id="team" placeholder="Ex. Els Falcons"></div><div><label for="people">Participants de l'equip</label><input id="people" type="number" min="1" value="8"></div></div><button onclick="addTeam()">Afegeix inscripció</button><button class="secondary" onclick="resetAll()">Reinicia llista</button><div id="result" class="result" aria-live="polite">Encara no hi ha inscripcions.</div></div>
<script>let teams=[];function render(msg=''){let cap=Number(document.querySelector('#capacity').value),n=teams.reduce((s,t)=>s+t.people,0),left=Math.max(0,cap-n);document.querySelector('#result').innerHTML='<h2>'+n+' / '+cap+' participants</h2><p>'+left+' places disponibles'+(n>cap?' · <b>Has superat l’aforament!</b>':'')+'</p><ul>'+teams.map(t=>'<li>'+t.name+' — '+t.people+'</li>').join('')+'</ul>'+msg}function addTeam(){let name=document.querySelector('#team').value.trim(),people=Number(document.querySelector('#people').value),cap=Number(document.querySelector('#capacity').value);if(!name||!Number.isInteger(people)||people<1||!Number.isInteger(cap)||cap<1){render(' <p>Completa el nom i introdueix nombres enters positius.</p>');return}let total=teams.reduce((s,t)=>s+t.people,0);if(total+people>cap){render(' <p>No s’ha afegit l’equip: supera l’aforament disponible.</p>');return}teams.push({name,people});document.querySelector('#team').value='';render()}function resetAll(){teams=[];render()}</script></html>
